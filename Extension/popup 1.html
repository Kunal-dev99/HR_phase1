<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #121419;
        --panel: #1a1d24;
        --panel-2: #20242d;
        --line: #2b303b;
        --ink: #e9ecf2;
        --muted: #8b93a4;
        --accent: #f5a524;
        --accent-dim: #6b4e16;
        --ok: #46d39a;
        --bad: #ff6b6b;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        width: 320px;
        background:
          radial-gradient(120% 80% at 100% 0%, #1b1f28 0%, var(--bg) 55%);
        color: var(--ink);
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        padding: 16px 16px 18px;
        -webkit-font-smoothing: antialiased;
      }
      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        margin-bottom: 14px;
      }
      h1 {
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        font-weight: 800;
        font-size: 17px;
        letter-spacing: -0.02em;
        margin: 0;
        line-height: 1;
      }
      h1 span { color: var(--accent); }
      .tag {
        font-size: 9px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .readout {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px;
        display: flex;
        gap: 10px;
        margin-bottom: 12px;
      }
      .stat { flex: 1; }
      .stat .n {
        font-size: 26px;
        font-weight: 600;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }
      .stat .n.accent { color: var(--accent); }
      .stat .l {
        font-size: 9px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-top: 6px;
      }
      .divider { width: 1px; background: var(--line); }

      .status {
        font-size: 11px;
        color: var(--muted);
        margin: 0 2px 12px;
        min-height: 14px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: var(--muted); flex: none;
      }
      .dot.run { background: var(--accent); box-shadow: 0 0 0 0 var(--accent);
        animation: pulse 1.3s infinite; }
      .dot.done { background: var(--ok); }
      .dot.err  { background: var(--bad); }
      @keyframes pulse {
        0%   { box-shadow: 0 0 0 0 rgba(245,165,36,.5); }
        70%  { box-shadow: 0 0 0 6px rgba(245,165,36,0); }
        100% { box-shadow: 0 0 0 0 rgba(245,165,36,0); }
      }

      .settings {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 14px;
      }
      .field { display: flex; flex-direction: column; gap: 5px; }
      .field.full { grid-column: 1 / -1; }
      label {
        font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase;
        color: var(--muted);
      }
      input {
        background: var(--panel-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        font-family: inherit;
        font-size: 13px;
        padding: 8px 10px;
        width: 100%;
      }
      input:focus { outline: none; border-color: var(--accent-dim); }
      .row2 { display: flex; gap: 8px; }
      .row2 input { width: 50%; }

      .buttons { display: flex; gap: 8px; margin-bottom: 8px; }
      button {
        flex: 1;
        font-family: inherit;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        padding: 11px 10px;
        border-radius: 9px;
        border: 1px solid var(--line);
        background: var(--panel-2);
        color: var(--ink);
        cursor: pointer;
        transition: transform .06s ease, background .15s ease, opacity .15s;
      }
      button:hover { background: #262b35; }
      button:active { transform: translateY(1px); }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      .primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #1b1405;
      }
      .primary:hover { background: #ffb53b; }
      .download {
        width: 100%;
        background: transparent;
        border: 1px dashed var(--line);
        color: var(--ink);
      }
      .download:hover { border-color: var(--accent-dim); background: var(--panel); }

      .note {
        font-size: 10px;
        line-height: 1.5;
        color: var(--muted);
        margin-top: 13px;
        padding-top: 12px;
        border-top: 1px solid var(--line);
      }
      .note b { color: #b9c0cf; font-weight: 600; }
      .toggle {
        display: flex; align-items: flex-start; gap: 9px;
        margin: 0 2px 14px; font-size: 11px; line-height: 1.45;
        color: var(--ink); cursor: pointer; user-select: none;
      }
      .toggle input { width: 15px; height: 15px; margin: 1px 0 0; accent-color: var(--accent); }
      .toggle em { color: var(--muted); font-style: normal; }
    </style>
  </head>
  <body>
    <header>
      <h1>SALES&nbsp;NAV<span>·</span>LIST</h1>
      <span class="tag">v1.8</span>
    </header>

    <div class="readout">
      <div class="stat">
        <div class="n accent" id="count">0</div>
        <div class="l">Profiles</div>
      </div>
      <div class="divider"></div>
      <div class="stat">
        <div class="n" id="pages">0</div>
        <div class="l">Pages</div>
      </div>
    </div>

    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">Idle — open a search and press Start.</span>
    </div>

    <div class="settings">
      <div class="field full">
        <label for="consultant">Source consultant (stamped on every row)</label>
        <input id="consultant" type="text" placeholder="e.g. Anil Passi" />
      </div>
      <div class="field">
        <label for="maxPages">Max pages (0=all)</label>
        <input id="maxPages" type="number" min="0" max="1000" value="0" />
      </div>
      <div class="field">
        <label>Delay / page (s)</label>
        <div class="row2">
          <input id="minDelay" type="number" min="2" max="60" value="4" />
          <input id="maxDelay" type="number" min="2" max="90" value="8" />
        </div>
      </div>
    </div>

    <label class="toggle">
      <input type="checkbox" id="resolvePublic" />
      <span>Resolve public profile URLs <em>(opens each menu — slower &amp; higher risk; for teammates without Sales&nbsp;Nav)</em></span>
    </label>

    <div class="buttons">
      <button id="start" class="primary">Start</button>
      <button id="stop" disabled>Stop</button>
    </div>
    <button id="download" class="download">Download CSV</button>
    <button
      id="reset"
      class="download"
      style="margin-top:8px;border-style:solid;"
    >
      Clear collected
    </button>

    <p class="note">
      <b>List mode only.</b> Reads the people already on your results pages —
      it never opens profiles. Keep delays human and spread large lists over a
      few days to stay clear of LinkedIn's rate limits.
    </p>

    <script src="popup.js"></script>
  </body>
</html>
